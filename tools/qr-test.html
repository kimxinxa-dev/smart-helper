<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스마트 헬퍼 QR 시험</title>
<!--
  QR 코드 검사 시험·시연용 페이지 (PC 브라우저로 열기). 앱에는 들어가지 않는 개발 도구다.
  팀원 @승민의 「스미싱 가드」 tools/qr-test.html 을 바탕으로, 스마트 헬퍼 시연 4가지와 인쇄 기능을 더했다.
  QR 그림은 qrcodejs(CDN)로 그린다 — 앱(index.html)은 외부 라이브러리를 쓰지 않지만, 이 도구는 PC 에서만 쓰므로 예외.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; font-family: "Malgun Gothic", sans-serif; background: #f3f5f9; color: #0f172a; }
  header { max-width: 1100px; margin: 0 auto; padding: 28px 16px 0; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p.note { margin: 0 0 8px; color: #475569; font-size: 15px; line-height: 1.6; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
  .tools button { padding: 10px 16px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; font: inherit; cursor: pointer; }
  .tools button.on { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; padding: 16px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 18px; text-align: center; break-inside: avoid; }
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 14px; font-weight: bold; }
  .LOW { background: #15803d; } .MID { background: #d97706; } .HIGH { background: #b91c1c; } .WIFI { background: #475569; }
  .title { margin: 10px 0 12px; font-size: 17px; font-weight: bold; }
  .qr { display: inline-block; padding: 10px; background: #fff; }
  .text { margin-top: 10px; font-family: Consolas, monospace; font-size: 13px; color: #475569; word-break: break-all; }
  .why { margin-top: 6px; font-size: 14px; color: #334155; }
  .hide { display: none; }
  @media print {
    body { background: #fff; } header .tools, p.note.screen { display: none; }
    main { grid-template-columns: repeat(2, 1fr); }
    .card { border: 2px solid #94a3b8; }
  }
</style>
</head>
<body>
<header>
  <h1>스마트 헬퍼 QR 시험</h1>
  <p class="note">휴대폰의 스마트 헬퍼에서 <b>문자 지킴이 → 📷 QR 코드 찍기</b>(또는 앱 아이콘 길게 누르기 → QR 코드 검사)로 아래 QR 을 찍어 보세요.</p>
  <p class="note">의심·위험 예시는 <b>실제로 없는 시험용 주소</b>입니다. 그래도 휴대폰에서 '그래도 열기'는 시연 때만 누르세요.</p>
  <p class="note screen">인쇄하려면 <b>Ctrl + P</b> (한 장에 2줄씩). 시연용 4개만 뽑으려면 먼저 '시연 4가지만'을 누르세요.</p>
  <div class="tools"><button id="demo" class="on">시연 4가지만</button><button id="all">모두 보기</button></div>
</header>
<main id="cards"></main>
<script>
  const LABEL = { LOW: "안전해 보임", MID: "확인 필요", HIGH: "위험", WIFI: "와이파이" };
  // [판정, 내용, 제목, 이유, 시연용인지]
  const CASES = [
    ["LOW",  "https://www.cjlogistics.com/ko/tool/parcel/tracking", "진짜 택배 조회", "공식 택배사 주소라 위험 신호 없음", true],
    ["MID",  "https://bit.ly/3kTz9", "가게 메뉴판 (단축 주소)", "단축 주소라 어디로 가는지 알 수 없음", true],
    ["WIFI", "WIFI:T:WPA;S:Cafe_Guest;P:secret1234;;", "카페 와이파이", "열지 않고 이름만 보여 줌, 비밀번호 숨김", true],
    ["HIGH", "http://parking-pay.xyz/pay.apk", "주차장 정산 QR 위 가짜 스티커", "앱 설치 파일(.apk) + 수상한 끝자리(.xyz)", true],
    // 아래는 스미싱 가드의 시험 예시를 스마트 헬퍼 판정에 맞춘 것
    ["LOW",  "https://www.gov.kr/portal", "정부24", "공식 사이트", false],
    ["LOW",  "https://example.com/menu", "모르는 일반 사이트", "위험 신호는 없음 (공식 목록 밖 1점)", false],
    ["MID",  "https://x.gd/1o6EU", "목록에 더한 단축 서비스", "x.gd 단축 주소", false],
    ["MID",  "https://ab.kr/Xy12k", "목록에 없는 단축 주소", "짧은 주소 이름 + 뜻 없는 코드 → 모양으로 알아봄", false],
    ["MID",  "http://192.0.2.10/login", "IP 주소 링크", "IP 주소로 바로 접속", false],
    ["MID",  "https://xn--naver-test.example.com/", "흉내 내는 글자 주소", "퓨니코드(xn--)", false],
    ["MID",  "https://sale-event.shop/gift", "QR 에서만 보는 끝자리", ".shop (정상 쇼핑몰도 써서 확인 필요까지만)", false],
    ["HIGH", "http://192.0.2.10/parking.apk", "IP 주소 + .apk", "앱 설치 파일을 IP 주소에서 내려받음", false],
  ];
  const box = document.getElementById("cards");
  CASES.forEach(([lv, content, title, why, demo]) => {
    const c = document.createElement("div");
    c.className = "card" + (demo ? " demo" : " extra");
    c.innerHTML = `<span class="badge ${lv}">${LABEL[lv]}</span><div class="title"></div><div class="qr"></div><div class="text"></div><div class="why"></div>`;
    c.querySelector(".title").textContent = title;
    c.querySelector(".text").textContent = content;
    c.querySelector(".why").textContent = why;
    new QRCode(c.querySelector(".qr"), { text: content, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
    box.appendChild(c);
  });
  const show = all => {
    document.querySelectorAll(".card.extra").forEach(c => c.classList.toggle("hide", !all));
    document.getElementById("demo").classList.toggle("on", !all);
    document.getElementById("all").classList.toggle("on", all);
  };
  document.getElementById("demo").onclick = () => show(false);
  document.getElementById("all").onclick = () => show(true);
  show(false);
</script>
</body>
</html>
