<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스마트 헬퍼</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#17202e;--mut:#5b6678;--pri:#1d4ed8;--hl:#f59e0b;--bd:#d8dee9;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#1a1e27;--tx:#eef0f4;--mut:#a3abb8;--bd:#2d3340;--pri:#5b8def}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#1a1e27;--tx:#eef0f4;--mut:#a3abb8;--bd:#2d3340;--pri:#5b8def}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center;align-items:center;padding:12px}

#main{flex:1;overflow-y:auto;padding:16px}
h1{margin:6px 0 2px;font-size:1.5em;text-align:center}h2{margin:0 0 10px;font-size:1.2em}
.sub{text-align:center;color:var(--mut);font-size:.8em;margin-bottom:14px}
.card{display:block;width:100%;text-align:left;margin-bottom:12px;padding:16px;border:2px solid var(--bd);border-radius:18px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.card b{display:block;font-size:1.05em}.card span{font-size:.72em;color:var(--mut)}
.big{font-size:2em}

.badge{font-size:.7em;padding:5px 10px;border-radius:14px;background:var(--bg);display:inline-block;margin-bottom:8px}
.badge.on{background:#fee2e2;color:var(--bad);font-weight:700}
#devwrap{position:relative;border:3px solid var(--bd);border-radius:18px;overflow:hidden;height:300px;background:var(--bg)}
#dev{padding:10px;height:100%;overflow:auto;transition:font-size .2s}
.dt{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}

.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.di{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 4px;font:inherit;font-size:.7em;cursor:pointer}.di i{display:block;font-style:normal;font-size:1.8em}
#dev input,#tin{width:100%;padding:10px;margin-bottom:8px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:.8em}
#tst{position:absolute;left:8px;right:8px;bottom:8px;background:#111827;color:#fff;padding:8px 10px;border-radius:10px;font-size:.65em;display:none}
#hl{position:absolute;display:none;border:4px solid var(--hl);border-radius:14px;box-shadow:0 0 0 5px rgba(245,158,11,.35);pointer-events:none;animation:p 1s infinite;z-index:5}
#arr{position:absolute;display:none;font-size:34px;pointer-events:none;z-index:6;animation:b .7s infinite}
#scan{position:absolute;left:0;right:0;height:4px;background:var(--hl);box-shadow:0 0 14px var(--hl);display:none;z-index:7;animation:s 1s linear infinite}
#lock{position:absolute;inset:0;display:none;z-index:9;backdrop-filter:blur(9px);background:rgba(20,24,34,.6);color:#fff;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:.8em;font-weight:700}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}@keyframes b{50%{transform:translateY(8px)}}@keyframes s{from{top:0}to{top:100%}}
#bub{margin:12px 0;padding:14px;border-radius:16px;background:#111827;color:#fff;font-size:.9em;line-height:1.5}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn.g{background:var(--bg);color:var(--tx);border:2px solid var(--bd)}.btn.on{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:8px 12px;border-radius:18px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:.68em;cursor:pointer}.chip.s{border-color:var(--pri);background:var(--pri);color:#fff}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal>div{background:var(--card);border-radius:20px;padding:20px}
textarea{width:100%;height:130px;padding:10px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:.8em;resize:none}
.res{border-radius:16px;padding:14px;margin-top:10px;border:3px solid}.res.hi{border-color:var(--bad)}.res.mid{border-color:var(--hl)}.res.lo{border-color:var(--ok)}
.res h3{margin:0 0 6px}.res ul{padding-left:20px;margin:6px 0;font-size:.85em}
.kf{border:3px solid #374151;border-radius:16px;padding:12px;background:var(--bg)}
.kh{background:#374151;color:#fff;border-radius:10px;padding:8px;text-align:center;font-weight:700;margin-bottom:10px;font-size:.85em}
.ko{display:block;width:100%;padding:16px;margin-bottom:10px;border:3px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;position:relative}
.ko.h{border-color:var(--hl);box-shadow:0 0 0 5px rgba(245,158,11,.35);animation:p 1s infinite}.ko.h::after{content:"👈";position:absolute;right:12px}
.pg{height:10px;border-radius:5px;background:var(--bd);margin-bottom:10px}.pg div{height:100%;border-radius:5px;background:var(--ok)}
#devwrap{height:440px;background:#fff}#dev{padding:0;background:#fff;color:#111}
#dev input{background:#fff;color:#111;border:1px solid #ccc;font-size:.75em;margin:0 0 8px}
.sb{display:flex;justify-content:space-between;font-size:.55em;padding:5px 12px}
.hd{display:flex;align-items:center;gap:6px;padding:6px 8px;font-weight:700;font-size:.8em;border-bottom:1px solid #eee}
.hd button{border:0;background:none;font:inherit;font-size:.85em;color:inherit;cursor:pointer;padding:4px 6px}.hd .r{margin-left:auto;display:flex}
.rw{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid #f1f1f1;background:#fff;color:#111;font:inherit;font-size:.72em;text-align:left;cursor:pointer}

.av{width:2.4em;height:2.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e5e7eb;flex:none}
.sq{width:2.2em;height:2.2em;border-radius:.6em;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ic{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#fff;font:inherit;font-size:.6em;cursor:pointer}.ic .sq{width:3.2em;height:3.2em;font-size:1.3em}
.wall{background:linear-gradient(160deg,#3b82f6,#8b5cf6);height:100%;color:#fff}
.m{max-width:75%;padding:6px 9px;border-radius:10px;margin-bottom:6px;background:#fff}.m.r{background:#fee500;margin-left:auto}
.ib{display:flex;align-items:center;gap:6px;padding:6px;border-top:1px solid #eee;font-size:.72em}.ib button{border:0;background:#eee;border-radius:50%;width:2em;height:2em;font:inherit;cursor:pointer}.fi{flex:1;background:#f3f4f6;border-radius:1em;padding:.5em .8em;color:#999}
.ph{height:5.5em;border:0;font-size:2em;cursor:pointer}
.bt{width:100%;padding:.8em;border:0;border-radius:.7em;background:#fee500;color:#111;font:inherit;font-size:.8em;font-weight:700;cursor:pointer}
.ab{width:2.2em;height:2.2em;border-radius:50%;border:1px solid #ccc;background:#f5f5f5;font:inherit;font-size:.9em;cursor:pointer;color:#111}
.tr{flex:1;height:6px;background:#ddd;border-radius:3px}.tr i{display:block;height:100%;background:#2563eb;border-radius:3px}
.gb{margin-left:auto;padding:.4em .9em;border:1px solid #2563eb;border-radius:1em;background:#fff;color:#2563eb;font:inherit;font-size:.9em;font-weight:700;cursor:pointer}
.sr{margin:8px 10px;padding:.6em .9em;background:#f1f3f4;border-radius:1.5em;font-size:.72em;color:#777}
.tb{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:6px;font-size:.6em;text-align:center;color:#666}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;font-size:.9em}.kp span{background:#f3f4f6;padding:.4em;border-radius:.4em}
.shot{background:#fff;color:#111;border:1px solid #ccc;border-radius:12px;overflow:hidden;font-size:15px;text-align:left}
.shot .sh{padding:6px 10px;border-bottom:1px solid #eee;font-weight:700;font-size:.8em}
.shot .sbub{margin:10px;padding:8px 10px;background:#e5e7eb;border-radius:12px;font-size:.85em;line-height:1.45;word-break:break-all}
.shot small{display:block;margin:0 12px 10px;color:#888;font-size:.65em}
.shot.sm{width:150px;height:175px;font-size:9px;pointer-events:none}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.stw{flex:none;border:0;background:none;padding:0;font:inherit;font-size:.65em;color:var(--tx);cursor:pointer}
#pv:not(:empty){margin:10px 0}
.kf{border:6px solid #1f2937;border-radius:14px;padding:0;overflow:hidden;background:#fff;color:#111}
.kf .kh{margin:0;border-radius:0;padding:10px;font-size:.9em}
.kc{display:flex;gap:4px;padding:6px 8px;background:#f3f4f6;font-size:.6em;flex-wrap:wrap}.kc span{padding:3px 8px;border-radius:10px;background:#e5e7eb}.kc .on{background:var(--kc);color:#fff;font-weight:700}.kc .dn{background:#bbf7d0}
.kq{padding:10px 12px 4px;font-weight:700;font-size:.9em}.kw{padding:8px 10px}.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kf .ko{background:#fff;color:#111;border-color:#d1d5db;margin-bottom:8px;font-size:.85em}.kf .kgrid .ko{margin:0}
.kb{display:flex;align-items:center;gap:12px;text-align:left}.ki{font-size:1.8em;min-width:1.5em;text-align:center}.kg{text-align:center}
.kb small,.kg small{display:block;font-weight:400;color:#6b7280;font-size:.7em}.kg.h::after{top:6px}
.kt{display:flex;gap:6px;padding:0 10px;font-size:.65em}.kt span{padding:4px 10px;border-radius:12px;background:#e5e7eb}.kt .on{background:#111;color:#fff}
.kn{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#111827;color:#fff;font-size:.65em}.kn span{flex:1}.kn button{border:0;border-radius:8px;padding:8px 10px;font:inherit;background:#374151;color:#fff;cursor:pointer}
.rc{background:#fff;color:#111;border:2px dashed #9ca3af;padding:14px;font-family:monospace;font-size:.8em;margin-bottom:10px}.rt{text-align:center;font-weight:700}.rn{text-align:center;font-size:2em;font-weight:700;margin:6px 0}.rr{display:flex;justify-content:space-between;border-top:1px dotted #ccc;padding:4px 0}
.cart{background:#fef3c7;color:#111;border-radius:10px;padding:10px;margin:0 10px 6px;font-size:.75em}
.pd{background:#f3f4f6;color:#111;border-radius:10px;padding:12px;text-align:center;font-size:1.1em;letter-spacing:4px;margin-bottom:8px;min-height:2.6em}
.kp2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pk{padding:12px;border:2px solid #d1d5db;background:#fff;color:#111;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
/* 안드로이드 앱 안에서는 휴대폰 테두리 없이 화면 전체를 쓴다 */
.app body{padding:0}.app #phone{width:100%;height:100vh;border:0;border-radius:0}
</style><script>window.Android&&document.documentElement.classList.add('app')</script></head>
<body>
<div id="phone">
  <div id="main"></div>
  <div id="bb">
    <button data-a="home"><i>🏠</i>처음 화면</button>
    <button data-a="back"><i>◀️</i>이전 단계</button>
    <button data-a="again"><i>🔁</i>다시 설명</button>
    <button data-a="end"><i>⏹️</i>도움 종료</button>

  <div id="modal"><div id="mbox"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
let view='home',lastMsg='',sharing=false,goal=null,dev,k,live=null;
const sb=(c='#111')=>`<div class="sb" style="color:${c}"><span>9:41</span><span>📶 🔋 82%</span></div>`;
const hd=(t,r='')=>`<div class="hd"><button data-id="back">◀</button>${t}<span class="r">${r}</span></div>`;
const rw=(id,ic,bg,t,s)=>`<button class="rw" data-id="${id}"><span class="sq" style="background:${bg}">${ic}</span><span>${t}<small>${s||''}</small></span></button>`;
const chat=(sheet,sent)=>sb()+hd('김영희','🔍 ☰')+`<div style="background:#b2c7da;height:${sheet?200:300}px;padding:10px;font-size:.7em;overflow:hidden"><div class="m">할머니 잘 지내세요? 😊</div><div class="m">오늘 손주 사진 보내 주세요~</div>${sent?'<div class="m r">🌄 사진 1장<br><small>읽지 않음 1</small></div>':''}</div><div class="ib"><button data-id="attach">＋</button><div class="fi">메시지 입력</div><span>전송</span></div>`+(sheet?`<div style="display:grid;grid-template-columns:repeat(4,1fr);background:#f5f5f5;padding:10px 4px">${[['gallery','🖼️','앨범'],['x1','📷','카메라'],['x2','📁','파일'],['x3','👤','연락처']].map(a=>`<button class="ic" style="color:#333" data-id="${a[0]}"><span class="sq" style="background:#fff;border:1px solid #ddd">${a[1]}</span>${a[2]}</button>`).join('')}</div>`:'');
const slider=(m,p,mi,pl)=>`<div style="display:flex;align-items:center;gap:8px;margin-top:16px"><button class="ab" data-id="${mi}">${m}</button><div class="tr"><i style="width:${p}%"></i></div><button class="ab" data-id="${pl}">${m=='－'?'＋':'가'}</button></div>`;
const app=(id,ic,bg,n,sub,b)=>`<div class="rw" style="cursor:default"><span class="sq" style="background:${bg}">${ic}</span><span>${n}<small>${sub}</small></span><button class="gb" data-id="${id}">${b}</button></div>`;
const D={
home:{g:{msg:'msg',set:'set',store:'store',con:'con',bank:'bank'},h:()=>`<div class="wall">${sb('#fff')}<div style="padding:14px 8px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 2px">${[['msg','💬','메신저','#fbbf24'],['set','⚙️','설정','#6b7280'],['store','🛍️','앱 스토어','#2563eb'],['con','👤','연락처','#16a34a'],['bank','🏦','은행','#0ea5e9'],['x1','📷','카메라','#ef4444'],['x2','📞','전화','#22c55e'],['x3','🌐','인터넷','#8b5cf6']].map(a=>`<button class="ic" data-id="${a[0]}"><span class="sq" style="background:${a[3]}">${a[1]}</span>${a[2]}</button>`).join('')}</div></div>`},
msg:{g:{chat:'chat'},h:()=>sb()+hd('채팅','🔍 ✏️')+`<button class="rw" data-id="chat"><span class="av">🙂</span><span>김영희<small>오늘 손주 사진 보내 주세요~</small></span><small>오전 9:12</small></button><button class="rw" data-id="x1"><span class="av">🙂</span><span>박철수<small>내일 보자</small></span><small>어제</small></button><button class="rw" data-id="x2"><span class="av">👪</span><span>우리 가족방<small>저녁 뭐 먹을까요</small></span><small>어제</small></button><div class="tb"><span>👥<br>친구</span><span>💬<br><b>채팅</b></span><span>⋯<br>더보기</span></div>`},
chat:{g:{attach:'attach'},h:()=>chat(0,0)},attach:{g:{gallery:'gallery'},h:()=>chat(1,0)},sent:{g:{},h:()=>chat(0,1)},
gallery:{g:{pic:'confirm'},h:()=>sb()+hd('앨범')+`<div style="padding:6px 10px;font-size:.65em;color:#666">최근 항목</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px">${[['pic','🌄','#93c5fd'],['x4','🌸','#fbcfe8'],['x5','🐶','#fde68a'],['x6','🍰','#fecaca'],['x7','⛰️','#bbf7d0'],['x8','🚗','#ddd6fe']].map(t=>`<button class="ph" data-id="${t[0]}" style="background:${t[2]}">${t[1]}</button>`).join('')}</div>`},
confirm:{g:{send:'sent'},h:()=>sb()+hd('사진 보내기')+`<div style="height:230px;background:#93c5fd;display:flex;align-items:center;justify-content:center;font-size:5em">🌄</div><div style="padding:12px"><button class="bt" data-id="send">보내기 (1)</button></div>`},
set:{g:{font:'font',sound:'sound'},h:()=>sb()+hd('설정')+`<div class="sr">🔍 설정 검색</div>`+rw('x1','📶','#3b82f6','연결','와이파이, 블루투스')+rw('sound','🔊','#10b981','소리 및 진동','음량, 벨소리')+rw('x2','🔔','#f59e0b','알림','앱 알림')+rw('font','🖥️','#6366f1','디스플레이','글자 크기, 밝기')+rw('x3','🔋','#84cc16','배터리','')+rw('x4','📱','#64748b','애플리케이션','')},
font:{g:{},h:()=>sb()+hd('글자 크기')+`<div style="padding:16px"><div style="background:#f3f4f6;border-radius:12px;padding:14px;font-size:.8em">가나다 abc 123<br>글자 크기를 바꾸면 이렇게 보여요.</div>${slider('가',dev.scale>1?85:dev.scale<1?15:50,'small','big')}</div>`},
sound:{g:{},h:()=>sb()+hd('소리 및 진동')+`<div style="padding:16px;font-size:.8em">미디어 음량 <b>${dev.vol}</b>${slider('－',dev.vol*10,'vdn','vup')}</div>`+rw('x1','📳','#10b981','진동','켜짐')+rw('x2','🎵','#8b5cf6','벨소리','')},
store:{g:{},h:()=>sb()+hd('앱 스토어')+`<div class="sr">🔍 앱 및 게임 검색</div>`+app('install','💪','#16a34a','건강 도우미','공식 · ⭐4.8 · 100만+ 다운로드','설치')+app('uninstall','🧩','#f59e0b','퍼즐 게임','설치됨 · 12MB','삭제')+app('unk','🎁','#ef4444','쿠폰 모아 <span style="color:#b91c1c">⚠️ 출처 불명</span>','문자 링크로 받은 파일','설치')},

const LV=['따라 하기','연습하기','혼자 하기','자유롭게'];
function kioskRender(){k=k&&k.lv!=null?k:{lv:0};main.innerHTML=`<h2>🍽️ 키오스크 연습</h2><div style="font-size:.7em;color:var(--mut)">연습 단계</div><div class="chips">${LV.map((l,i)=>`<button class="chip ${i==k.lv?'s':''}" data-l="${i}">${l}</button>`).join('')}</div>
<div style="font-size:.7em;color:var(--mut);margin-bottom:8px">${['화살표가 알려 줘요','"다시 설명"을 누르면 힌트가 나와요','도움 없이 해 봐요','목표 없이 마음대로 눌러 봐요'][k.lv]} · 원하는 대로 골라도 괜찮아요</div>
${Object.keys(K).map(i=>`<button class="card" data-k="${i}"><b>${K[i].n}</b><span>${K[i].g}</span></button>`).join('')}`;
 main.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{k.lv=+b.dataset.l;kioskRender()});
 main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{k={lv:k.lv,id:b.dataset.k,step:0,miss:0,sel:[],hint:k.lv==0};view='play';playRender()})}
function kprev(){do{k.step--}while(k.step>0&&k.sel[k.step]=='—');k.sel.length=k.step;k.hint=k.lv==0;playRender()}
function playRender(){const c=K[k.id],s=c.s[k.step];k.sel=k.sel||[];if(s&&s[4]&&!s[4](k.sel)){k.sel[k.step]='—';k.step++;return playRender()}
 const pad=()=>`<div class="pd">${k.pin?'●'.repeat(k.pin.length):'숫자를 눌러 주세요'}</div><div class="kp2">${[1,2,3,4,5,6,7,8,9,'지움',0,'확인'].map(n=>`<button class="pk" data-p="${n}">${n}</button>`).join('')}</div>`;
 if(!s){const hit=c.s.filter((t,i)=>t[1].length&&k.sel[i]==t[1][t[2]]).length,tn=c.s.filter(t=>t[1].length).length;main.innerHTML=`<div class="rc"><div class="rt">${c.h}</div><div class="rn">${c.no}</div>${k.sel.map((x,i)=>x=='—'?'':`<div class="rr"><span>${c.cr[i]}</span><b>${x}</b></div>`).join('')}${k.id=='food'?`<div class="rr"><span>합계</span><b>${(M[k.sel[1]][2]*(parseInt(k.sel[2])||1)).toLocaleString()}원</b></div>`:''}<div class="rt" style="font-size:.75em;margin-top:8px">${c.fin}</div></div><div class="res lo"><h3>🎉 잘 하셨어요!</h3>끝까지 해 보셨어요.<br>${k.lv<3?`추천 과제와 같게 고른 단계: ${hit}/${tn} (점수는 없어요)`:'마음대로 골라 보셨어요.'}</div><button class="btn" style="margin-top:12px" id="re">다시 해 보기</button><button class="btn g" id="ot">다른 연습 고르기</button>`;
  $('#re').onclick=()=>{k.step=0;k.sel=[];k.hint=k.lv==0;playRender()};$('#ot').onclick=()=>go('kiosk');say('잘 하셨어요! 끝까지 해 보셨어요.');return}
 const ty=s[3],opt=o=>{const m=M[o]||['',''],h=k.hint&&k.lv<3&&o==s[1][s[2]]?' h':'';
  return ty=='g'?`<button class="ko kg${h}" data-v="${o}"><span style="font-size:2em;display:block">${m[0]}</span>${o}<small>${m[1]||''}</small></button>`:`<button class="ko kb${h}" data-v="${o}"><span class="ki">${m[0]}</span><span>${o}<small>${m[1]||''}</small></span></button>`};
 const tot=k.id=='food'&&k.sel[1]?'합계 '+(M[k.sel[1]][2]*(parseInt(k.sel[2])||1)).toLocaleString()+'원':'';
 main.innerHTML=`<div style="font-size:.7em;color:var(--mut);margin-bottom:6px">${LV[k.lv]} · ${k.lv<3?'🎯 '+c.g:'🎈 마음대로 눌러 보세요'}</div>
<div class="kf" style="--kc:${c.c}"><div class="kh" style="background:${c.c}">${c.h}</div>
<div class="kc">${c.cr.map((x,i)=>`<span class="${i==k.step?'on':i<k.step?'dn':''}">${i+1}. ${x}</span>`).join('')}</div>
${k.id=='food'&&ty=='g'?'<div class="kt" style="margin-top:8px"><span class="on">추천</span><span>식사</span><span>사이드</span><span>음료</span></div>':''}
<div class="kq">${s[0]}</div>${s[5]?`<div class="cart">🧾 ${k.sel.filter(x=>x!='—').join(' › ')} <b>${tot}</b></div>`:''}<div class="kw">${ty=='p'?pad():`<div class="${ty=='g'?'kgrid':''}">${s[1].map(opt).join('')}</div>`}</div>
<div class="kn"><button id="kp">◀ 이전</button><span>🛒 ${k.sel.join(' › ')||'고른 내용이 여기에 보여요'} <b>${tot}</b></span><button id="kx">🏠 처음</button></div></div>
<div id="kmsg" style="margin-top:10px;font-size:.85em">${k.msg||''}</div>`;k.msg='';
 $('#kp').onclick=()=>{if(k.step>0)kprev();else go('kiosk')};$('#kx').onclick=()=>go('kiosk');
 main.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{const v=b.dataset.p;k.pin=k.pin||'';let m='';if(v=='지움')k.pin=k.pin.slice(0,-1);else if(v=='확인'){if(k.pin.length<4)m='4자리 이상 눌러 주세요.';else{k.sel[k.step]='번호 입력 완료';k.step++;k.pin=''}}else if(k.pin.length<8)k.pin+=v;k.msg=m;playRender();m&&say(m)});
 main.querySelectorAll('.ko').forEach(b=>b.onclick=()=>{const v=b.dataset.v;let m='';
  if(v=='취소'||v=='처음으로'){k.step=0;k.sel=[];k.hint=k.lv==0;m='처음 화면으로 돌아왔어요. 다시 골라 보세요.'}
  else if(v=='메뉴 다시 고르기'){k.step=1;k.sel.length=1;m='메뉴를 다시 골라 주세요.'}
  else if(k.id=='train'&&k.step==1&&v==k.sel[0])m='출발역과 같아요. 다른 도착역을 골라 주세요.';
  else{k.sel[k.step]=v;k.step++;k.hint=k.lv==0}
  k.msg=m;playRender();m&&say(m)});
 if(!k.msg)say(s[0]+(k.hint&&k.lv<3?' 표시된 곳을 눌러 보세요.':' 원하는 것을 눌러 보세요.'))}

render();
</script></body></html>
