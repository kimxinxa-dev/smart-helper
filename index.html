<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>스마트 헬퍼</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#17202e;--mut:#5b6678;--pri:#1d4ed8;--hl:#f59e0b;--bd:#d8dee9;--ok:#15803d;--bad:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1117;--card:#1a1e27;--tx:#eef0f4;--mut:#a3abb8;--bd:#2d3340;--pri:#5b8def}}
:root[data-theme="dark"]{--bg:#0e1117;--card:#1a1e27;--tx:#eef0f4;--mut:#a3abb8;--bd:#2d3340;--pri:#5b8def}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;justify-content:center;align-items:center;padding:12px}
#phone{position:relative;width:400px;max-width:100%;height:min(780px,calc(100vh - 24px));background:var(--card);border:8px solid #20232b;border-radius:34px;display:flex;flex-direction:column;overflow:hidden;font-size:20px}
#main{flex:1;overflow-y:auto;padding:16px}
h1{margin:6px 0 2px;font-size:1.5em;text-align:center}h2{margin:0 0 10px;font-size:1.2em}
.sub{text-align:center;color:var(--mut);font-size:.8em;margin-bottom:14px}
.card{display:block;width:100%;text-align:left;margin-bottom:12px;padding:16px;border:2px solid var(--bd);border-radius:18px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.card b{display:block;font-size:1.05em}.card span{font-size:.72em;color:var(--mut)}
.big{font-size:2em}
#bb{display:flex;border-top:2px solid var(--bd)}
#bb button{flex:1;padding:10px 2px;border:0;background:var(--card);color:var(--tx);font:inherit;font-size:.62em;font-weight:600;cursor:pointer;border-right:1px solid var(--bd)}
#bb button:last-child{color:var(--bad);border:0}#bb i{display:block;font-style:normal;font-size:1.5em}
.badge{font-size:.7em;padding:5px 10px;border-radius:14px;background:var(--bg);display:inline-block;margin-bottom:8px}
.badge.on{background:#fee2e2;color:var(--bad);font-weight:700}
#devwrap{position:relative;border:3px solid var(--bd);border-radius:18px;overflow:hidden;height:300px;background:var(--bg)}
#dev{padding:10px;height:100%;overflow:auto;transition:font-size .2s}
.dt{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:700}
.dt button{border:0;background:var(--card);color:var(--pri);font:inherit;font-size:.75em;padding:6px 10px;border-radius:10px;cursor:pointer}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.di{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:10px 4px;font:inherit;font-size:.7em;cursor:pointer}.di i{display:block;font-style:normal;font-size:1.8em}
#dev input,#tin{width:100%;padding:10px;margin-bottom:8px;border:2px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:.8em}
#tst{position:absolute;left:8px;right:8px;bottom:8px;background:#111827;color:#fff;padding:8px 10px;border-radius:10px;font-size:.65em;display:none}
#hl{position:absolute;display:none;border:4px solid var(--hl);border-radius:14px;box-shadow:0 0 0 5px rgba(245,158,11,.35);pointer-events:none;animation:p 1s infinite;z-index:5}
#arr{position:absolute;display:none;font-size:34px;pointer-events:none;z-index:6;animation:b .7s infinite}
#scan{position:absolute;left:0;right:0;height:4px;background:var(--hl);box-shadow:0 0 14px var(--hl);display:none;z-index:7;animation:s 1s linear infinite}
#lock{position:absolute;inset:0;display:none;z-index:9;backdrop-filter:blur(9px);background:rgba(20,24,34,.6);color:#fff;align-items:center;justify-content:center;text-align:center;padding:14px;font-size:.8em;font-weight:700}
@keyframes p{50%{box-shadow:0 0 0 12px rgba(245,158,11,0)}}@keyframes b{50%{transform:translateY(8px)}}@keyframes s{from{top:0}to{top:100%}}
#bub{margin:12px 0;padding:14px;border-radius:16px;background:#111827;color:#fff;font-size:.9em;line-height:1.5}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn.g{background:var(--bg);color:var(--tx);border:2px solid var(--bd)}.btn.on{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{padding:8px 12px;border-radius:18px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:.68em;cursor:pointer}.chip.s{border-color:var(--pri);background:var(--pri);color:#fff}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
#modal>div{background:var(--card);border-radius:20px;padding:20px}
textarea{width:100%;height:130px;padding:10px;border:2px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:.8em;resize:none}
.res{border-radius:16px;padding:14px;margin-top:10px;border:3px solid}.res.hi{border-color:var(--bad)}.res.mid{border-color:var(--hl)}.res.lo{border-color:var(--ok)}
.res h3{margin:0 0 6px}.res ul{padding-left:20px;margin:6px 0;font-size:.85em}
.pg{height:10px;border-radius:5px;background:var(--bd);margin-bottom:10px}.pg div{height:100%;border-radius:5px;background:var(--ok)}
#devwrap{height:440px;background:#fff}#dev{padding:0;background:#fff;color:#111}
#dev input{background:#fff;color:#111;border:1px solid #ccc;font-size:.75em;margin:0 0 8px}
.sb{display:flex;justify-content:space-between;font-size:.55em;padding:5px 12px}
.hd{display:flex;align-items:center;gap:6px;padding:6px 8px;font-weight:700;font-size:.8em;border-bottom:1px solid #eee}
.hd button{border:0;background:none;font:inherit;font-size:.85em;color:inherit;cursor:pointer;padding:4px 6px}.hd .r{margin-left:auto;display:flex}
.rw{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid #f1f1f1;background:#fff;color:#111;font:inherit;font-size:.72em;text-align:left;cursor:pointer}
.rw small{display:block;color:#888;font-size:.8em}.rw>small{margin-left:auto}
.av{width:2.4em;height:2.4em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e5e7eb;flex:none}
.sq{width:2.2em;height:2.2em;border-radius:.6em;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ic{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#fff;font:inherit;font-size:.6em;cursor:pointer}.ic .sq{width:3.2em;height:3.2em;font-size:1.3em}
.wall{background:linear-gradient(160deg,#3b82f6,#8b5cf6);height:100%;color:#fff}
.m{max-width:75%;padding:6px 9px;border-radius:10px;margin-bottom:6px;background:#fff}.m.r{background:#fee500;margin-left:auto}
.ib{display:flex;align-items:center;gap:6px;padding:6px;border-top:1px solid #eee;font-size:.72em}.ib button{border:0;background:#eee;border-radius:50%;width:2em;height:2em;font:inherit;cursor:pointer}.fi{flex:1;background:#f3f4f6;border-radius:1em;padding:.5em .8em;color:#999}
#dev .ib input.fi{flex:1;width:auto;margin:0;border:0;padding:.5em .8em;border-radius:1em;background:#f3f4f6;color:#111;font-size:1em}
.ib .snd{border:0;background:#fee500;border-radius:1em;padding:.4em .7em;font:inherit;cursor:pointer;width:auto;height:auto}
.tb button{border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.pill{margin-left:auto;background:#ccc;color:#fff;border-radius:1em;padding:.2em .7em;font-size:.8em}.pill.on{background:#2563eb}.dim{display:block;color:#ccc;font-size:.6em}
.ph{height:5.5em;border:0;font-size:2em;cursor:pointer}
.bt{width:100%;padding:.8em;border:0;border-radius:.7em;background:#fee500;color:#111;font:inherit;font-size:.8em;font-weight:700;cursor:pointer}
.ab{width:2.2em;height:2.2em;border-radius:50%;border:1px solid #ccc;background:#f5f5f5;font:inherit;font-size:.9em;cursor:pointer;color:#111}
.tr{flex:1;height:6px;background:#ddd;border-radius:3px}.tr i{display:block;height:100%;background:#2563eb;border-radius:3px}
.gb{margin-left:auto;padding:.4em .9em;border:1px solid #2563eb;border-radius:1em;background:#fff;color:#2563eb;font:inherit;font-size:.9em;font-weight:700;cursor:pointer}
.sr{margin:8px 10px;padding:.6em .9em;background:#f1f3f4;border-radius:1.5em;font-size:.72em;color:#777}
.tb{display:flex;justify-content:space-around;border-top:1px solid #eee;padding:6px;font-size:.6em;text-align:center;color:#666}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;text-align:center;font-size:.9em}.kp span{background:#f3f4f6;padding:.4em;border-radius:.4em}
.shot{background:#fff;color:#111;border:1px solid #ccc;border-radius:12px;overflow:hidden;font-size:15px;text-align:left}
.shot .sh{padding:6px 10px;border-bottom:1px solid #eee;font-weight:700;font-size:.8em}
.shot .sbub{margin:10px;padding:8px 10px;background:#e5e7eb;border-radius:12px;font-size:.85em;line-height:1.45;word-break:break-all}
.shot small{display:block;margin:0 12px 10px;color:#888;font-size:.65em}
.shot.sm{width:150px;height:175px;font-size:9px;pointer-events:none}
.strip{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px}
.stw{flex:none;border:0;background:none;padding:0;font:inherit;font-size:.65em;color:var(--tx);cursor:pointer}
#pv:not(:empty){margin:10px 0}
/* ---------- 키오스크 (실제 기기 모양: 화면 + 아래 투입구·출력구) ---------- */
.kxtop{display:flex;align-items:center;gap:6px;font-size:.65em;color:var(--mut);margin-bottom:8px}.kxtop span{flex:1}
.kxtop button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:4px 8px;font:inherit;cursor:pointer}
.kx{--kc:#c2410c;background:linear-gradient(#2b3340,#1a1f29);border-radius:22px;padding:10px 10px 0;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.kxscr{position:relative;background:#fff;color:#111;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-height:430px;font-size:.8em}
.kx.big .kxscr{font-size:.95em}
.kxbar{display:flex;align-items:center;gap:6px;background:var(--kc);color:#fff;padding:8px 10px}.kxbar b{flex:1}
.kxbar button{border:1px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:8px;padding:3px 7px;font:inherit;font-size:.72em;cursor:pointer}
.kxtime{font-size:.72em;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:10px;white-space:nowrap}
.kxsteps{display:flex;gap:3px;padding:6px 8px;background:#f3f4f6;font-size:.62em;overflow-x:auto;white-space:nowrap}
.kxsteps span{padding:3px 7px;border-radius:9px;background:#e5e7eb;color:#6b7280}.kxsteps .on{background:var(--kc);color:#fff;font-weight:700}.kxsteps .dn{background:#dcfce7;color:#166534}
.kxbody{flex:1;padding:10px 10px 22px}.kxbody.idle{padding:0;display:flex}
.kxq{font-weight:800;font-size:1.15em;margin:2px 0 10px;text-align:center}
.kxnote{font-size:.72em;color:#b45309;text-align:center;margin:-6px 0 8px}
.kxfoot{display:flex;gap:6px;padding:8px;border-top:1px solid #e5e7eb;background:#f9fafb}
.kxfoot button,.kxbtn{position:relative;border:0;border-radius:10px;padding:10px 12px;font:inherit;font-size:.82em;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111}
.kxfoot .go,.kxbtn.go{margin-left:auto;background:var(--kc);color:#fff;flex:1}.kxfoot .go:disabled{opacity:.35}
.kxopts{display:grid;gap:8px}.kxopts.c2{grid-template-columns:1fr 1fr}.kxopts.c3{grid-template-columns:repeat(3,1fr)}
.kxo{position:relative;border:2px solid #e5e7eb;border-radius:14px;background:#fff;color:#111;font:inherit;font-weight:700;padding:12px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left}
.kxo i{font-style:normal;font-size:1.7em}.kxo small{display:block;font-weight:400;color:#6b7280;font-size:.75em}
.kxo.tile{flex-direction:column;justify-content:center;text-align:center;min-height:110px;gap:4px;padding:10px 4px}.kxo.tile i{font-size:2.4em}
.kxo:disabled{opacity:.3;cursor:default}
.kxopts.grid .kxo.tile{min-height:64px;padding:6px 2px}.kxopts.grid .kxo.tile i{font-size:1.3em}
.kxidle{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,var(--kc),#111827);color:#fff;cursor:pointer;padding:20px;position:relative;border:0}
.kxidle .em{font-size:3.6em}.kxidle .t{margin-top:18px;font-size:1.05em;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.35}}
.kxtabs{display:flex;border-bottom:2px solid #e5e7eb;margin:-10px -10px 10px}
.kxtabs button{position:relative;flex:1;border:0;border-bottom:3px solid transparent;background:none;padding:10px 2px;font:inherit;font-size:.85em;font-weight:700;color:#6b7280;cursor:pointer}
.kxtabs .on{color:var(--kc);border-bottom-color:var(--kc)}
.kxmenu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kxm{position:relative;border:2px solid #e5e7eb;border-radius:12px;background:#fff;padding:0 0 8px;font:inherit;color:#111;cursor:pointer;text-align:center}
.kxm .kxph{display:block;font-size:2.4em;padding:10px 0;background:#fff7ed;border-radius:10px 10px 0 0;margin-bottom:4px}
.kxm b{display:block;font-size:.88em}.kxm small{color:var(--kc);font-weight:700;font-size:.8em}
.kxm .bdg{position:absolute;top:5px;left:5px;background:#ef4444;color:#fff;font-size:.62em;padding:1px 6px;border-radius:8px}
.kxcart{border-top:2px solid #e5e7eb;padding:8px 10px;background:#fffbeb;font-size:.8em}
.kxcart .row,.kxsum .row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 0}
.kxcart .row button{border:0;background:#fde68a;border-radius:6px;font:inherit;font-size:.8em;padding:1px 6px;cursor:pointer}
.kxcart .tot,.kxsum .tot{font-weight:800;color:var(--kc);font-size:1.1em;border-top:1px dashed #d1d5db;margin-top:4px;padding-top:6px}
.kxsum{background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:.88em}
.kxpop{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.kxpop>div{background:#fff;border-radius:16px;padding:16px;width:100%;text-align:center}
.qty{display:flex;align-items:center;justify-content:center;gap:16px;margin:10px 0;font-size:1.3em;font-weight:800}
.qty button{position:relative;width:2em;height:2em;border-radius:50%;border:2px solid #d1d5db;background:#fff;font:inherit;cursor:pointer;color:#111}
.kxcnt{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding:4px 2px}.kxcnt small{display:block;color:#6b7280;font-size:.75em}.kxcnt .qty{margin:4px 0;font-size:1.1em}
.kxdate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.kxdate .kxo{min-height:70px;font-size:.85em}
.kxroute{text-align:center;font-weight:700;color:var(--kc);margin:-4px 0 8px;font-size:.9em}
.kxrow{position:relative;display:grid;grid-template-columns:1.35fr 1.4fr .9fr;align-items:center;gap:4px;width:100%;border:2px solid #e5e7eb;border-radius:10px;background:#fff;color:#111;font:inherit;font-size:.82em;padding:10px 8px;margin-bottom:6px;cursor:pointer;text-align:left}
.kxrow small{text-align:right;font-weight:700;color:var(--kc)}.kxrow:disabled{opacity:.4}.kxrow:disabled small{color:#b91c1c}
.kxcar{text-align:center;font-weight:700;margin-bottom:6px;font-size:.85em}.kxcar small{display:block;font-weight:400;color:#6b7280;font-size:.8em}
.kxseat{display:grid;grid-template-columns:1fr 1fr .5fr 1fr 1fr;gap:5px;max-width:250px;margin:0 auto}
.st{position:relative;border:2px solid #93c5fd;background:#eff6ff;border-radius:8px 8px 4px 4px;font:inherit;font-size:.7em;padding:6px 0;cursor:pointer;color:#1e3a8a}
.st:disabled{background:#d1d5db;border-color:#d1d5db;color:#9ca3af}.st.sel{background:var(--kc);border-color:var(--kc);color:#fff}
.kxseat .ai{font-size:.6em;color:#9ca3af;display:flex;align-items:center;justify-content:center}
.kxamt{text-align:center;margin-bottom:10px}.kxamt b{display:block;font-size:1.6em;color:var(--kc)}
.kxins{text-align:center;padding:12px;border:2px dashed #d1d5db;border-radius:14px;line-height:1.5}.kxins .em{font-size:3.2em}
.kxins .arrow{font-size:1.4em;margin-top:8px;animation:b .7s infinite}.kxins small{display:block;color:#6b7280;font-size:.75em}
.kxinsbtn{margin-top:10px;border:0;background:none;color:#2563eb;text-decoration:underline;font:inherit;font-size:.75em;cursor:pointer}
.kxdone{text-align:center;padding:20px 8px;line-height:1.6}.kxdone .em{font-size:3.6em}.kxdone .no{font-size:1.9em;font-weight:800;color:var(--kc);margin:6px 0}
.kxhw{display:flex;justify-content:center;gap:8px;padding:12px 6px 14px}
.slot{position:relative;flex:1;max-width:25%;background:#0b0f16;color:#9ca3af;border:2px solid #374151;border-radius:8px;padding:5px 2px 6px;font:inherit;font-size:.5em;cursor:pointer}
.slot::before{content:"";display:block;height:5px;margin:0 4px 5px;background:#000;border-radius:3px;box-shadow:inset 0 1px 2px #444}
.slot i{font-style:normal;display:block;font-size:1.6em}.slot.act{color:#fff;border-color:#facc15;animation:p 1s infinite}
.paper{margin:-6px auto 10px;width:88%;animation:print 1.8s ease-out;overflow:hidden}@keyframes print{from{max-height:0}to{max-height:700px}}
.hint{border-color:var(--hl)!important;box-shadow:0 0 0 4px rgba(245,158,11,.6);animation:p 1s infinite;z-index:2}
.hint::after{content:"👆";position:absolute;left:50%;bottom:-1.05em;margin-left:-.5em;font-size:1.5em;line-height:1;animation:b .7s infinite;pointer-events:none;z-index:6}
#kmsg{margin-top:10px;font-size:.85em}
.rc{background:#fff;color:#111;border:2px dashed #9ca3af;padding:14px;font-family:monospace;font-size:.8em;margin-bottom:10px}.rt{text-align:center;font-weight:700}.rn{text-align:center;font-size:2em;font-weight:700;margin:6px 0}.rr{display:flex;justify-content:space-between;border-top:1px dotted #ccc;padding:4px 0}
.pd{background:#f3f4f6;color:#111;border-radius:10px;padding:12px;text-align:center;font-size:1.1em;letter-spacing:4px;margin-bottom:8px;min-height:2.6em}
.kp2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pk{position:relative;padding:12px;border:2px solid #d1d5db;background:#fff;color:#111;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
/* 안드로이드 앱 안에서는 휴대폰 테두리 없이 화면 전체를 쓴다 */
.app body{padding:0}.app #phone{width:100%;height:100vh;border:0;border-radius:0}
</style><script>window.Android&&document.documentElement.classList.add('app')</script></head>
<body>
<div id="phone">
  <div id="main"></div>
  <div id="bb">
    <button data-a="home"><i>🏠</i>처음 화면</button>
    <button data-a="back"><i>◀️</i>이전 단계</button>
    <button data-a="again"><i>🔁</i>다시 설명</button>
    <button data-a="end"><i>⏹️</i>도움 종료</button>
  </div>
  <div id="modal"><div id="mbox"></div></div>
</div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
let view='home',lastMsg='',lastAsk='',lastReal='',sharing=false,goal=null,dev,k,live=null;
const sb=(c='#111')=>`<div class="sb" style="color:${c}"><span>9:41</span><span>📶 🔋 82%</span></div>`;

 const paper=done&&kprinted()?`<div class="rc paper"><div class="rt">${c.brand}</div><div class="rn">${c.done()[1]}</div>${k.sel.map((x,i)=>x=='—'||i==k.sel.length-1||c.s[i].t=='insert'||/^(결제하기|접수하기)$/.test(x)?'':`<div class="rr"><span>${c.s[i].cr}</span><b>${x}</b></div>`).join('')}${k.id!='hosp'||job()!='진료 접수'?`<div class="rr"><span>합계</span><b>${won(kamt())}</b></div>`:''}<div class="rt" style="font-size:.75em;margin-top:8px">${new Date().toLocaleString('ko-KR')}</div></div>`:'';
 const hit=k.ok.filter(x=>x===true).length,tn=k.ok.filter(x=>x!==undefined).length;
 main.innerHTML=`<div class="kxtop"><span>${LV[k.lv]} · ${k.lv<3?'🎯 '+c.g:'🎈 마음대로 눌러 보세요'}</span><button id="kq">✕ 그만</button></div>
<div class="kx${k.big?' big':''}" style="--kc:${c.c}"><div class="kxscr">
<div class="kxbar"><b>${c.brand}</b>${idle||done?'':`<button id="kbig">${k.big?'기본 글씨':'가 큰 글씨'}</button><span class="kxtime">⏱ <span id="ktm">${k.left}</span>초</span>`}</div>
${idle||done?'':`<div class="kxsteps">${crumbs.map(x=>`<span class="${x.st}">${x.cr}</span>`).join('')}</div>`}
<div class="kxbody${idle?' idle':''}">${body}</div>${cart}
${idle||done?'':`<div class="kxfoot"><button id="kp">◀ 이전</button><button id="kh">⌂ 처음으로</button>${go}</div>`}${pop}</div>
<div class="kxhw">${c.hw.map(h=>`<button class="slot${act==h?' act'+hc(1):''}" data-slot="${h}"><i>${SLOT[h][0]}</i>${SLOT[h][1]}</button>`).join('')}</div>${paper}</div>
<div id="kmsg">${k.msg}</div>
${done?`<div class="res lo"><h3>🎉 잘 하셨어요!</h3>끝까지 해 보셨어요.<br>${k.lv<3?`추천 과제와 같게 고른 단계: ${hit}/${tn} (점수는 없어요)`:'마음대로 골라 보셨어요.'}</div><button class="btn" style="margin-top:12px" id="re">다시 해 보기</button><button class="btn g" id="ot">다른 연습 고르기</button>`:''}`;
 /* 말하기: 단계가 바뀔 때만 (같은 화면을 다시 그릴 때는 조용히) */
 lastMsg=say1;const key=k.step+'|'+(k.pop||'')+'|'+(k.phase||'');
 if(k.msg)say(k.msg);else if(k.said!=key)say(say1+(H&&!done&&!idle?' 표시된 곳을 눌러 보세요.':''));
 k.said=key;k.msg='';
 if(done){$('#re').onclick=()=>{kreset();playRender()};$('#ot').onclick=()=>go('kiosk')}
 $('#kq').onclick=()=>go('kiosk');
 main.querySelector('.kx').onclick=e=>{k.left=120;const b=e.target.closest('button');if(b&&!b.disabled)ktap(b,s,c)};
 /* 남은 시간: 0초가 돼도 처음으로 돌리지 않고 실제 키오스크라면 어떻게 되는지 알려 준다 */
 clearInterval(kT);if(!idle&&!done)kT=setInterval(()=>{const t=$('#ktm');if(view!='play'||!t){clearInterval(kT);return}if(k.left>0&&!$('#kto')){k.left--;t.textContent=k.left;if(!k.left)ktimeout()}},1000)}
function ksum(){const c=K[k.id];if(k.id=='food')return`<div class="kxsum">${Object.entries(k.cart).map(([m,q])=>`<div class="row"><span>${M[m][0]} ${m} × ${q}</span><span>${won(M[m][1]*q)}</span></div>`).join('')}<div class="row"><span>장소</span><span>${k.sel[1]}</span></div><div class="row tot"><span>합계</span><span>${won(kcartTotal())}</span></div></div>`;
 if(job()=='진료 접수')return`<div class="kxsum">${[2,3,6].map(i=>k.sel[i]&&k.sel[i]!='—'?`<div class="row"><span>${c.s[i].cr}</span><b>${k.sel[i]}</b></div>`:'').join('')}</div>`;
 return`<div class="kxsum">${job()=='수납'?'<div class="row"><span>진찰료</span><span>15,000원</span></div><div class="row"><span>검사료</span><span>9,800원</span></div><div class="row"><span>건강보험 부담</span><span>-18,600원</span></div>':`<div class="row"><span>${k.sel[4]} 1부</span><span>${won(kamt())}</span></div>`}<div class="row tot"><span>내실 금액</span><span>${won(kamt())}</span></div></div>`}
function ktimeout(){const sc=main.querySelector('.kxscr');if(!sc)return;sc.insertAdjacentHTML('beforeend',`<div class="kxpop" id="kto"><div><div style="font-size:2.6em">⏰</div><b style="font-size:1.15em">시간이 다 됐어요</b><p style="font-size:.85em;line-height:1.5">실제 키오스크는 한동안 누르지 않으면 <b>처음 화면으로 돌아가요.</b> 연습에서는 이어서 할 수 있어요.</p><button class="kxbtn go" id="kcont" style="width:100%">계속하기</button></div></div>`);
 say('시간이 다 됐어요. 실제 키오스크는 한동안 누르지 않으면 처음 화면으로 돌아가요. 연습에서는 계속하기를 누르면 이어서 할 수 있어요.')}
/* 누르기 처리 */
function ktap(b,s,c){const d=b.dataset,msg=m=>{k.msg=m;playRender()};
 if(b.id=='kcont'){$('#kto').remove();return}
 if(d.a=='idle')return knext('—');
 if(b.id=='kp')return k.step>0?kprev():go('kiosk');
 if(b.id=='kh'){kreset();return msg('처음 화면으로 돌아왔어요.')}
 if(b.id=='kbig'){k.big=!k.big;return playRender()}
 if(d.slot){if(!s||s.t!='insert'||k.phase)return msg(`${SLOT[d.slot][1]} ${d.slot=='rcpt'?'출력구':'투입구'}예요. 지금은 쓰지 않아요.`);
  const m=kmode(s);if(d.slot!=m)return msg(`그곳은 ${SLOT[d.slot][1]} 투입구예요. 노랗게 깜빡이는 '${SLOT[m][1]}' 칸에 넣어 주세요.`);
  const st=k.step,ok=()=>view=='play'&&k.step==st;k.phase='run';playRender();
  setTimeout(()=>{if(!ok())return;k.phase='ok';playRender();setTimeout(()=>{if(ok())knext(s.pay?{card:'카드 결제 완료',qr:'간편결제 완료',cash:'현금 결제 완료'}[m]:'본인 확인 완료')},1300)},1500);return}
 if(d.tab){k.tab=d.tab;return playRender()}
 if(d.item){k.pop=d.item;k.qty=1;return playRender()}
 if(d.q){k.qty=Math.max(1,Math.min(9,k.qty+ +d.q));return playRender()}
 if(d.pop){const p=k.pop;k.pop=null;if(d.pop=='ok'){k.cart[p]=(k.cart[p]||0)+k.qty;return msg(`${p} ${k.qty}개를 담았어요. 다 고르셨으면 '주문하기'를 눌러 주세요.`)}return playRender()}
 if(d.rm){delete k.cart[d.rm];return playRender()}
 if(d.c){k.cnt[d.c]=Math.max(0,Math.min(9,(k.cnt[d.c]||0)+ +d.d));return playRender()}
 if(d.seat){k.seat=d.seat;return playRender()}
 if(d.row){k.row=+d.row;const r=TRAINS[k.row];return knext(`${r[0]} ${r[1]} 출발`,k.row==s.a)}
 if(d.p){const v=d.p;if(v=='지움')k.pin=k.pin.slice(0,-1);else if(v=='확인'){if(k.pin.length<4)return msg('4자리 이상 눌러 주세요.');k.pin='';return knext('번호 입력 완료')}else if(k.pin.length<8)k.pin+=v;return playRender()}
 if(b.id=='kgo'){
  if(s.t=='menu')return knext(Object.entries(k.cart).map(([n,q])=>`${n} ${q}개`).join(', '),Object.entries(s.a).every(([n,q])=>k.cart[n]==q));
  if(s.t=='count')return knext(Object.entries(k.cnt).filter(([,v])=>v).map(([n,v])=>`${n} ${v}명`).join(', '),s.rows.every(([n])=>(k.cnt[n]||0)==(s.a[n]||0)));
  if(s.t=='seat')return knext(`3호차 ${k.seat}${/[AD]/.test(k.seat)?' (창가)':''}`,/[AD]/.test(k.seat));return}
 if(d.v==null)return;const v=d.v;
 if(s.t=='date')return knext(DAYS[v]+(['(오늘)','(내일)'][v]||''),+v==s.a);
 if(v=='처음으로'){kreset();return msg('처음 화면으로 돌아왔어요. 다시 해 보세요.')}
 if(v=='메뉴 더 담기'){k.step=c.s.findIndex(x=>x.t=='menu');k.sel.length=k.ok.length=k.step;return playRender()}
 if(v=='쿠폰 사용')k.msg='연습에서는 쿠폰이 적용된 것으로 할게요.';
 knext(v,v==kv(s.o)[s.a])}

render();
</script></body></html>
